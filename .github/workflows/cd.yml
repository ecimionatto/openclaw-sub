name: CD — Continuous Delivery

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  # ── 1. Gate: unit tests ───────────────────────────────────────────────────
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node ./bin/clawsub.mjs help

  # ── 2. Gate: Docker e2e ───────────────────────────────────────────────────
  docker-e2e:
    name: Docker e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run e2e in Docker
        run: |
          docker build -f test/e2e/Dockerfile -t clawsub-e2e .
          docker run --rm clawsub-e2e

  # ── 3. Gate: CS-18 eval scenarios ────────────────────────────────────────
  eval:
    name: CS-18 eval scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/eval.test.mjs

  # ── 4. Release: tag + GitHub Release + npm publish --tag next ─────────────
  release:
    name: Tag & Release
    needs: [unit, docker-e2e, eval]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || node -e "process.stdout.write(require('./package.json').version)")
          VERSION=$(node scripts/next-version.mjs --current "$CURRENT")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $VERSION"

      - name: Bump package.json version
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create git tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            scripts/install-ubuntu.sh
            skills/clawsub/SKILL.md

      - name: Publish to npm --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish"
          else
            npm publish --tag next --access public
          fi

  # ── 5. Promote: dist-tag latest (gated by production environment) ─────────
  promote:
    name: Promote to latest
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Promote next -> latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping dist-tag promotion"
          else
            npm dist-tag add "openclaw-sub@${{ needs.release.outputs.version }}" latest
            echo "Promoted openclaw-sub@${{ needs.release.outputs.version }} to latest"
          fi
