name: CD — Continuous Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. Gate: unit tests ───────────────────────────────────────────────────
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node ./bin/clawsub.mjs help

  # ── 2. Gate: Docker e2e ───────────────────────────────────────────────────
  docker-e2e:
    name: Docker e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run e2e in Docker
        run: |
          docker build -f test/e2e/Dockerfile -t clawsub-e2e .
          docker run --rm clawsub-e2e

  # ── 3. Gate: CS-18 eval scenarios ────────────────────────────────────────
  eval:
    name: CS-18 eval scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/eval.test.mjs

  # ── 4. Release: tag + GitHub Release + npm publish --tag next ─────────────
  release:
    name: Tag & Release
    needs: [unit, docker-e2e, eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize releases: only one release runs at a time.
    # With cancel-in-progress: false the in-progress run always finishes; a queued
    # pending run is replaced by a newer push. Each run releases exactly its own
    # tested SHA independently, so being superseded is safe.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Detect existing release tag for this SHA
        id: existing_tag
        run: |
          TAG=$(git tag --points-at "$GITHUB_SHA" | grep '^v' | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "SHA $GITHUB_SHA already tagged as $TAG — will reuse"
          fi
          # If this SHA is an ancestor of an already-released tag, a newer merge beat us;
          # skip to avoid publishing older code under a version tag it doesn't match.
          LATEST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ] && [ -z "$TAG" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$LATEST_TAG" 2>/dev/null; then
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA is an ancestor of $LATEST_TAG — skipping release for superseded SHA"
          else
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        id: version
        if: steps.existing_tag.outputs.skip_release != 'true'
        run: |
          if [ -n "${{ steps.existing_tag.outputs.tag }}" ]; then
            VERSION="${{ steps.existing_tag.outputs.tag }}"
            VERSION="${VERSION#v}"
          else
            SINCE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$SINCE" ]; then
              VERSION=$(node scripts/next-version.mjs --current "$SINCE" --since "$SINCE")
            else
              CURRENT=$(node -e "process.stdout.write(require('./package.json').version)")
              VERSION=$(node scripts/next-version.mjs --current "$CURRENT")
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Tag tested SHA and push
        if: steps.existing_tag.outputs.skip_release != 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING_SHA=$(git rev-list -1 "$TAG")
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::notice::Tag $TAG already exists on $EXISTING_SHA (not $GITHUB_SHA) — skipping release for this SHA"
              exit 0
            fi
            echo "Tag $TAG already exists on this SHA — skipping"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Set package.json version for publish
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --generate-notes \
              scripts/install-ubuntu.sh \
              skills/clawsub/SKILL.md
          fi

      - name: Publish to npm --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish"
          else
            VERSION="${{ steps.version.outputs.version }}"
            if npm view "openclaw-sub@$VERSION" version >/dev/null 2>&1; then
              echo "Version $VERSION already published — skipping"
            else
              npm publish --tag next --access public
            fi
          fi

  # ── 5. Promote: dist-tag latest (gated by production environment) ─────────
  promote:
    name: Promote to latest
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Promote next -> latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping dist-tag promotion"
          else
            VERSION="${{ needs.release.outputs.version }}"
            CURRENT_LATEST=$(npm view openclaw-sub dist-tags.latest 2>/dev/null || echo "0.0.0")
            # Skip if latest is already >= VERSION to prevent rolling back a newer release.
            SHOULD_PROMOTE=$(node -e "
              const v = s => s.replace(/^v/,'').split('.').map(Number);
              const a = v('$CURRENT_LATEST');
              const b = v('$VERSION');
              const cmp = a[0]!==b[0] ? a[0]-b[0] : a[1]!==b[1] ? a[1]-b[1] : a[2]-b[2];
              process.stdout.write(cmp < 0 ? 'yes' : 'no');
            ")
            if [ "$SHOULD_PROMOTE" = "yes" ]; then
              npm dist-tag add "openclaw-sub@$VERSION" latest
              echo "Promoted openclaw-sub@$VERSION to latest"
            else
              echo "::notice::Skipping promotion: latest ($CURRENT_LATEST) is already >= $VERSION"
            fi
          fi
