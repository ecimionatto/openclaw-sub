name: CD — Continuous Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── 1. Gate: unit tests ───────────────────────────────────────────────────
  unit:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node ./bin/clawsub.mjs help

  # ── 2. Gate: Docker e2e ───────────────────────────────────────────────────
  docker-e2e:
    name: Docker e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run e2e in Docker
        run: |
          docker build -f test/e2e/Dockerfile -t clawsub-e2e .
          docker run --rm clawsub-e2e

  # ── 3. Gate: CS-18 eval scenarios ────────────────────────────────────────
  eval:
    name: CS-18 eval scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/eval.test.mjs

  # ── 4. Release: tag + GitHub Release + npm publish --tag next ─────────────
  release:
    name: Tag & Release
    needs: [unit, docker-e2e, eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize releases so concurrent merges don't race to tag the same version.
    # cancel-in-progress: false ensures a pending run is not cancelled by a later one.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull latest main so a commit pushed by a concurrent release is visible
      # and our version bump won't be rejected as non-fast-forward.
      - name: Pull latest main
        run: git pull origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Compute next version
        id: version
        run: |
          SINCE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$SINCE" ]; then
            VERSION=$(node scripts/next-version.mjs --current "$SINCE" --since "$SINCE")
          else
            CURRENT=$(node -e "process.stdout.write(require('./package.json').version)")
            VERSION=$(node scripts/next-version.mjs --current "$CURRENT")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed next version: $VERSION"

      - name: Bump package.json version
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # Push the bump commit and tag atomically so either both land or neither does.
      # If the tag already exists (re-run after partial failure), skip to avoid
      # a non-fast-forward push error on the bump commit.
      - name: Commit, tag, and push atomically
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping commit and push"
          else
            git add package.json
            git diff --cached --quiet || git commit -m "chore(release): $TAG [skip ci]"
            git tag "$TAG"
            git push --atomic origin HEAD "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --generate-notes \
              scripts/install-ubuntu.sh \
              skills/clawsub/SKILL.md
          fi

      - name: Publish to npm --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish"
          else
            VERSION="${{ steps.version.outputs.version }}"
            if npm view "openclaw-sub@$VERSION" version >/dev/null 2>&1; then
              echo "Version $VERSION already published — skipping"
            else
              npm publish --tag next --access public
            fi
          fi

  # ── 5. Promote: dist-tag latest (gated by production environment) ─────────
  promote:
    name: Promote to latest
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Promote next -> latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping dist-tag promotion"
          else
            npm dist-tag add "openclaw-sub@${{ needs.release.outputs.version }}" latest
            echo "Promoted openclaw-sub@${{ needs.release.outputs.version }} to latest"
          fi
